name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Build web app
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Prepare signing key
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No KEYSTORE_BASE64 secret: building an unsigned-for-release debug APK instead. Add the 4 signing secrets (see README) so updates install over each other."
          fi

      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PATH: ${{ steps.sign.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_PATH" ]; then
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/RhythmTrainer-${VERSION_CODE}.apk"
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/RhythmTrainer-${VERSION_CODE}-debug.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: RhythmTrainer-apk
          path: ${{ runner.temp }}/RhythmTrainer-*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Rhythm Trainer build ${{ github.run_number }}
          body: Download the APK below on your phone and tap it to install or update.
          files: ${{ runner.temp }}/RhythmTrainer-*.apk
